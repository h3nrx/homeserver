# ----- Protection: per-visitor limits -----
# Requests arrive through Tailscale Funnel, which puts the visitor's IP in
# X-Forwarded-For; nginx itself only sees the Docker gateway.
limit_req_zone  $binary_remote_addr zone=site:10m  rate=15r/s;
limit_req_zone  $binary_remote_addr zone=api:10m   rate=10r/s;
limit_req_zone  $binary_remote_addr zone=login:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=files:10m rate=3r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

map $uri $page_cache {
    default "";
    ~(/|\.html)$ "no-cache";
    ~(/sw\.js|\.webmanifest)$ "no-cache";
}

# Hosted files that a browser would execute (HTML, SVG, XML, JS) are always
# downloaded instead of rendered, so they can never run on this origin.
map $uri $file_disposition {
    default "inline";
    "~*\.(html?|xhtml|xht|shtml|svgz?|xml|xsl|xslt|js|mjs|php)$" "attachment";
}

map $arg_dl $dl_disposition {
    default $file_disposition;
    "1"     "attachment";
}

# A share link opened in a browser tab shows a preview page with a download
# button first. Embeds, link previews (Discord etc.), curl and ?dl=1 / ?raw=1
# get the file itself.
map "$http_sec_fetch_dest|$arg_dl$arg_raw" $file_page {
    default     0;
    "document|" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 4k;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn perip 40;

    # Slow or stuck clients get dropped instead of tying up connections.
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 30s;
    keepalive_requests 200;

    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' https://cdn.discordapp.com https://mc-heads.net https://cdn.modrinth.com data:; connect-src 'self' https://api.lanyard.rest; manifest-src 'self'; worker-src 'self'; media-src 'self' blob:; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cache-Control $page_cache always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # Hidden files and typical scanner targets.
    location ~ "^/(?!api/|f/).*/\." { return 404; }
    location ~* "^/(?!api/|f/).*\.(php|asp|aspx|jsp|cgi|env|git|bak|sql)$" { return 404; }

    # ----- Admin API -----
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        # $http_host keeps the port; the panel compares it with Origin.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # JSON bodies; the panel enforces its own per-endpoint limits.
        client_max_body_size 1m;
        proxy_read_timeout 120s;
    }

    # ----- Login: few attempts per visitor -----
    location = /api/login {
        limit_req zone=login burst=5 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # ----- File hoster upload (large, streamed) -----
    location = /api/files/upload {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 2048m;
        client_body_timeout 120s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ----- Upload with an upload key (iPad/iPhone shortcut), streamed -----
    location = /api/u {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 2048m;
        client_body_timeout 120s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # ----- Bot file / zip upload -----
    location ~ "^/api/bots/[a-z0-9_-]+/upload$" {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 25m;
        proxy_read_timeout 120s;
    }

    # ----- File hoster downloads -----
    # Only shared files are public; signed-in visitors see every file. The
    # panel decides per request (/api/fileaccess), unknown or private -> 404.
    location ~ "^/f/([A-Za-z0-9_-]{12})/(.+)$" {
        limit_req zone=files burst=20 nodelay;
        limit_conn perip 8;
        error_page 418 = @filepage;
        if ($file_page) { return 418; }
        auth_request /__fileaccess;
        error_page 403 = @nofile;
        alias /files/$1/$2;
        add_header Content-Disposition $dl_disposition always;
        add_header Vary "Sec-Fetch-Dest" always;
        add_header Content-Security-Policy "script-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, max-age=600" always;
    }
    location = /__fileaccess {
        internal;
        proxy_pass http://panel:3000/api/fileaccess;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Host $http_host;
    }
    location @nofile { return 404; }

    location @filepage {
        limit_req zone=site burst=40 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
    }

    # ----- Clip hoster: upload (large, streamed) and poster image -----
    location = /api/clips/upload {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 2048m;
        client_body_timeout 120s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location = /api/convert/upload {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 2048m;
        client_body_timeout 120s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location = /api/compress/upload {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        client_max_body_size 2048m;
        client_body_timeout 120s;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location ~ "^/api/clips/[A-Za-z0-9_-]{10}/thumb$" {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
        client_max_body_size 4m;
    }

    # ----- Clip player page (public, rendered by the panel) -----
    location ~ "^/c/[A-Za-z0-9_-]{10}$" {
        limit_req zone=site burst=40 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
    }

    # ----- Pastebin (public, rendered by the panel) -----
    location ~ "^/p/[A-Za-z0-9_-]{10}(/raw)?$" {
        limit_req zone=site burst=40 nodelay;
        proxy_pass http://panel:3000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $http_host;
    }

    # ----- Clip video and poster files (public) -----
    location ~ "^/v/([A-Za-z0-9_-]{10})\.(mp4|webm|mov|m4v|jpg)$" {
        limit_req zone=files burst=40 nodelay;
        limit_conn perip 8;
        alias /files/clips/$1/clip.$2;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # ----- Clip: small H.264 copy for Discord embeds -----
    location ~ "^/v/([A-Za-z0-9_-]{10})/(embed|stream)\.mp4$" {
        limit_req zone=files burst=40 nodelay;
        limit_conn perip 8;
        alias /files/clips/$1/$2.mp4;
        default_type video/mp4;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ----- Downloader results (?dl=1 forces a download) -----
    location ~ "^/d/([A-Za-z0-9_-]{10})/([^/]+)$" {
        limit_req zone=files burst=20 nodelay;
        limit_conn perip 8;
        alias /files/downloads/$1/$2;
        add_header Content-Disposition $dl_disposition always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; media-src 'self'; frame-ancestors 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "private, max-age=3600" always;
    }

    # ----- Music radio (media service) -----
    # The media container may be down or restarting; resolving at request time
    # keeps nginx itself running either way.
    location ~ "^/radio/[A-Za-z0-9_-]{16}/?$" {
        limit_req zone=site burst=40 nodelay;
        try_files /radio.html =404;
    }
    location ~ "^/radio/[A-Za-z0-9_-]{16}/[A-Za-z0-9_-]{10}\.mp3$" {
        limit_req zone=api burst=20 nodelay;
        limit_conn perip 4;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $media_up http://media:8000;
        proxy_pass $media_up;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 90s;
        send_timeout 60s;
    }
    location ~ "^/radio/[A-Za-z0-9_-]{16}/(stations\.json|[A-Za-z0-9_-]{10}\.jpg)$" {
        limit_req zone=api burst=30 nodelay;
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $media_up http://media:8000;
        proxy_pass $media_up;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # App manifest for the installable admin (nginx doesn't know the type)
    location = /admin/manifest.webmanifest {
        limit_req zone=site burst=80 nodelay;
        types { }
        default_type application/manifest+json;
    }

    location / {
        limit_req zone=site burst=80 nodelay;
        try_files $uri $uri/ =404;
    }
}
