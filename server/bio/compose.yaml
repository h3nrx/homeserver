services:
  bio:
    image: nginx:alpine
    container_name: bio
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }
    restart: unless-stopped
    read_only: true
    depends_on:
      - panel
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    ports:
      # Nur lokal erreichbar. Ins Internet kommt die Seite ueber Tailscale Funnel.
      - "127.0.0.1:8080:80"
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - __HOME__/files:/files:ro

  panel:
    image: node:22-alpine
    container_name: panel
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    command: ["node", "/app/server.js"]
    env_file:
      - ../minecraft/.env
    environment:
      RCON_HOST: minecraft
      AUTH_FILE: /data/auth.json
      SERVER_ADDRESS: ${SERVER_ADDRESS:-}
      LOCAL_ADDRESS: ${LOCAL_ADDRESS:-}
      MEDIA_TOKEN: ${MEDIA_TOKEN:-}
      IPC_DIR: /ipc
      BOTS_DIR: /bots
      FILES_DIR: /files
    volumes:
      - ./panel:/app:ro
      - ./panel-data:/data:ro
      - ../minecraft/control:/control
      - ../minecraft/data/logs:/mc/logs:ro
      - ../minecraft/data/plugins:/mc/plugins
      - /var/lib/panel:/ipc
      - __HOME__/bots:/bots
      - __HOME__/files:/files
    networks:
      - default
      - mcnet

  # Radio (YouTube audio as MP3 streams) and Discord-ready clip copies.
  media:
    build: ./media
    image: __SLUG__-media
    container_name: media
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "1" }
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2.5
    pids_limit: 256
    tmpfs:
      - /tmp:size=512m
    environment:
      MEDIA_TOKEN: ${MEDIA_TOKEN:-}
      FILES_DIR: /files
      MUSIC_DIR: /music
    volumes:
      - ./media:/app:ro
      - __HOME__/files:/files
      - __HOME__/music:/music

networks:
  mcnet:
    external: true
