<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__BRAND__</title>
<meta name="description" content="__BRAND__">
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" type="image/png" href="img/__ICON__-logo-64.png">
<link rel="apple-touch-icon" href="img/__ICON__-logo-192.png">
<meta property="og:title" content="__BRAND__">
<meta property="og:image" content="__PUBLIC_URL__/img/og.jpg?v=2">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preload" href="fonts/geist.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Geist"; src: url("fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; background: #0a0a0b; }
  body { color: #f1f1ef; font-family: "Geist", "Segoe UI", system-ui, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; opacity: 0; transition: opacity 1.6s ease; }
  canvas.on { opacity: 1; }
  main { position: fixed; inset: auto 0 0; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; pointer-events: none;
    padding: 0 max(48px, env(safe-area-inset-right)) max(44px, calc(env(safe-area-inset-bottom) + 20px)) max(48px, env(safe-area-inset-left)); }
  h1 { margin: 0; font-size: clamp(40px, 6vw, 84px); font-weight: 500; letter-spacing: -.045em; line-height: .9; min-width: 0; overflow-wrap: anywhere; }
  p { margin: 0; flex: none; text-align: right; font-size: 14px; line-height: 1.6; color: #a3a3a0; font-variant-numeric: tabular-nums; }
  p span { display: block; }
  #mc { color: #f1f1ef; }
  #mc:empty { display: none; }
  @media (max-width: 600px) { main { padding: 0 24px max(28px, calc(env(safe-area-inset-bottom) + 14px)); } p { font-size: 13px; } }
  @media (prefers-reduced-motion: reduce) { canvas { transition: none; } }
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>
<main><h1>__BRAND__</h1><p><span id="mc" aria-live="polite"></span><span id="clock"></span></p></main>
<script>
const $ = (id) => document.getElementById(id);
const DISCORD_ID = "__DISCORD_ID__";   // not shown here; bootstrap.sh reads it

/* ============ contour lines ============ */
const VERT = "attribute vec2 a; void main() { gl_Position = vec4(a, 0., 1.); }";
const FRAG = `#extension GL_OES_standard_derivatives : enable
precision highp float;
uniform vec2 r, m; uniform float t, px;
vec2 h(vec2 p) { p = mod(p, 289.); vec3 q = fract(vec3(p.xyx) * vec3(.1031, .1030, .0973)); q += dot(q, q.yzx + 33.33); return fract((q.xx + q.yz) * q.zy) * 2. - 1.; }
float n(vec2 p) {                       // gradient noise: smooth hills, no grid
  vec2 i = floor(p), f = fract(p), u = f * f * f * (f * (f * 6. - 15.) + 10.);
  return mix(mix(dot(h(i), f), dot(h(i + vec2(1, 0)), f - vec2(1, 0)), u.x),
             mix(dot(h(i + vec2(0, 1)), f - vec2(0, 1)), dot(h(i + vec2(1, 1)), f - vec2(1, 1)), u.x), u.y);
}
void main() {
  float s = min(r.x, r.y);
  vec2 p = (gl_FragCoord.xy - .5 * r) / s, d = p - m;
  float near = exp(-dot(d, d) * 9.);
  float v = n(p * 1.5 + t * vec2(.022, .014) + 40.) + .42 * n(p * 3. - t * vec2(.018, .026) + 90.) + .14 * near;
  float e = v * 17., w = fwidth(e), l = abs(fract(e - .5) - .5) / max(w, 1e-4);
  float a = 1. - smoothstep(px * .35, px * .35 + 1., l);
  a *= 1. - smoothstep(.25, .6, w);     // steep places would turn into a grey mass
  float bold = step(mod(floor(e + .5), 5.), .5);
  float y = gl_FragCoord.y / r.y, fade = mix(.25, 1., smoothstep(.02, .38, y));
  gl_FragColor = vec4(vec3(.039, .039, .043) + a * (mix(.17, .46, bold) * fade + near * .22), 1.);
}`;
const cv = $("c"), still = matchMedia("(prefers-reduced-motion: reduce)").matches;
let gl, U, raf = 0;
const aim = { x: .3, y: .12 }, at = { x: .3, y: .12 };
function init() {
  gl = cv.getContext("webgl", { antialias: false, alpha: false, powerPreference: "low-power" });
  if (!gl || !gl.getExtension("OES_standard_derivatives")) { gl = null; return; }
  const pr = gl.createProgram();
  for (const [type, src] of [[gl.VERTEX_SHADER, VERT], [gl.FRAGMENT_SHADER, FRAG]]) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s); gl.attachShader(pr, s);
  }
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(pr)); gl = null; return; }
  gl.useProgram(pr);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const a = gl.getAttribLocation(pr, "a");
  gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
  U = Object.fromEntries(["r", "m", "t", "px"].map((k) => [k, gl.getUniformLocation(pr, k)]));
  size();
  cv.classList.add("on");
}
function size() {
  if (!gl) return;
  // sharp on phones, but never more than about 4 million pixels
  const px = Math.min(devicePixelRatio || 1, 2, Math.sqrt(4e6 / Math.max(1, innerWidth * innerHeight)));
  cv.width = Math.round(innerWidth * px); cv.height = Math.round(innerHeight * px);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(U.r, cv.width, cv.height); gl.uniform1f(U.px, px);
  draw(performance.now());
}
function draw(now) {
  at.x += (aim.x - at.x) * .04; at.y += (aim.y - at.y) * .04;
  gl.uniform2f(U.m, at.x, at.y); gl.uniform1f(U.t, still ? 0 : now / 1000);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
}
function loop(now) { raf = 0; if (!gl || document.hidden) return; draw(now); raf = requestAnimationFrame(loop); }
const run = () => { if (gl && !still && !raf) raf = requestAnimationFrame(loop); };
function point(e) {
  const s = Math.min(innerWidth, innerHeight);
  aim.x = (e.clientX - innerWidth / 2) / s; aim.y = (innerHeight / 2 - e.clientY) / s;
}
addEventListener("pointermove", point); addEventListener("pointerdown", point);
addEventListener("resize", size);
cv.addEventListener("webglcontextlost", (e) => { e.preventDefault(); gl = null; });
cv.addEventListener("webglcontextrestored", () => { init(); run(); });
init(); run();

/* ============ clock + who is playing ============ */
const de = /^de/i.test(navigator.language || "");
if (de) document.documentElement.lang = "de";
const fmt = new Intl.DateTimeFormat("de-DE", { timeZone: "Europe/Berlin", hour: "2-digit", minute: "2-digit" });
const set = (id, text) => { if ($(id).textContent !== text) $(id).textContent = text; };
const tick = () => set("clock", fmt.format(new Date()));
tick(); setInterval(tick, 2000);

// A random id per tab, so the server can count who is here right now.
let visitId = "";
try { visitId = sessionStorage.getItem("vid") || ""; } catch {}
if (!/^[a-f0-9]{16}$/.test(visitId)) {
  visitId = [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, "0")).join("");
  try { sessionStorage.setItem("vid", visitId); } catch {}
}
let timer = 0;
async function poll() {
  clearTimeout(timer);
  if (!document.hidden) {
    try {
      const r = await fetch(`/api/public?id=${visitId}`, { cache: "no-store" });
      const mc = r.ok ? (await r.json()).mc || {} : {}, n = mc.active ? Number(mc.online) || 0 : 0;
      set("mc", !n ? "" : de ? (n === 1 ? "1 spielt Minecraft" : `${n} spielen Minecraft`) : `${n} playing Minecraft`);
    } catch { set("mc", ""); }
  }
  clearTimeout(timer);
  timer = setTimeout(poll, 5000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) { poll(); run(); } });
poll();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => {});
</script>
</body>
</html>
