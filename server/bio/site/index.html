<style>
  @font-face { font-family: "Geist"; src: url("fonts/geist.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url("fonts/jetbrains-mono.woff2") format("woff2"); font-weight: 300 800; font-display: swap; }

  /* The whole page is one object: the laptop this site is served from.
     Every length hangs off --w (the laptop's width), so it scales as one piece. */
  :root {
    --w: min(70vw, 780px, 60vh);

    --ease: cubic-bezier(.2, .8, .2, 1);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: #050609; color: #fff; overflow: hidden;
    font-family: "Geist", "Segoe UI", system-ui, sans-serif; letter-spacing: -.01em;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  [hidden] { display: none !important; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }

  /* the room: one lamp from above, colored by the screen once it's on */
  #room { position: fixed; inset: 0; pointer-events: none; background: var(--air, #050609); transition: background 1.2s ease; }
  #room::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .7s ease;
    background: radial-gradient(46% 52% at 36% 30%, rgb(255 176 96 / .16), transparent 72%); }
  body.lamp-on #room::before { opacity: 1; }
  #room::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease .3s;
    background: radial-gradient(52% 40% at 50% 40%, color-mix(in srgb, var(--acc) 26%, transparent), transparent 72%); }
  body[data-s="on"] #room::after, body[data-s="boot"] #room::after { opacity: 1; }

  /* #view clips the scene, so zooming in can never widen the page */
  #view { position: fixed; inset: 0; overflow: hidden; contain: strict; }
  #stage { transform-origin: 0 0; }   /* the zoom maths assume the top-left corner */
  #stage { position: absolute; inset: 0; display: grid; place-items: center; perspective: calc(var(--w) * 2.4); perspective-origin: 50% 38%; cursor: grab; }
  #stage.drag { cursor: grabbing; }
  #stage { outline: none; }
  .rig, .laptop, .base, .lid, .flies, .fly, .fly i, .tbl, .props, .o { transform-style: preserve-3d; }
  .dolly { transform-style: preserve-3d; transition: transform 1.4s var(--ease); }
  body[data-s="closed"] .dolly { transform: scale(1.02); }
  .rig { width: 0; height: 0; transform: translateY(calc(var(--w) * .27)) rotateX(-24deg) rotateY(-16deg); }
  .laptop { position: absolute; left: 0; top: 0; transform: translateZ(calc(var(--d) * -.5)); }

  /* ---------- base ---------- */
  .base { position: absolute; left: calc(var(--w) * -.5); top: 0; width: var(--w); height: var(--d);
    transform-origin: 50% 0; transform: rotateX(90deg); }
  .deck { position: absolute; inset: 0; border-radius: calc(var(--w) * .012) calc(var(--w) * .012) calc(var(--w) * .03) calc(var(--w) * .03);
    background: linear-gradient(180deg, #353945, #23262f 55%, #1c1e26); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .07); overflow: hidden; }
  /* light falling from the screen onto the keyboard */
  .deck::after { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease .5s; pointer-events: none;
    background: linear-gradient(180deg, color-mix(in srgb, var(--acc) 34%, transparent), transparent 62%); mix-blend-mode: screen; }
  body:not([data-s="closed"]) .deck::after { opacity: 1; }
  .lip { position: absolute; background: linear-gradient(180deg, #2a2d37, #121318); }
  .lip.f { left: 0; top: 100%; width: 100%; height: var(--t); transform-origin: 50% 0; transform: rotateX(-90deg); border-radius: 0 0 calc(var(--w) * .02) calc(var(--w) * .02); }
  .lip.b { left: 0; top: 0; width: 100%; height: var(--t); transform-origin: 50% 0; transform: rotateX(-90deg) rotateY(180deg) translateY(0); }
  .lip.l { left: 0; top: 0; width: var(--t); height: 100%; transform-origin: 0 50%; transform: rotateY(90deg); }
  .lip.r { right: 0; top: 0; width: var(--t); height: 100%; transform-origin: 100% 50%; transform: rotateY(-90deg); }
  .shadow { position: absolute; left: -9%; top: -6%; width: 118%; height: 120%; transform: translateZ(calc(var(--t) * -1.05));
    background: radial-gradient(closest-side, rgb(0 0 0 / .75), transparent); filter: blur(calc(var(--w) * .02)); }

  .grille { position: absolute; left: 6%; top: 3.4%; width: 26%; height: 2.6%; opacity: .5;
    background: radial-gradient(circle, #000 38%, transparent 42%) 0 0 / calc(var(--w) * .009) calc(var(--w) * .009); }

  #keys { position: absolute; left: 4.5%; right: 4.5%; top: 7.5%; height: 52%; display: flex; flex-direction: column; gap: 2.2%; }
  .row { flex: 1; display: flex; gap: .55%; }
  .row.fn { flex: .6; }
  .key.w { font-size: calc(var(--w) * .0095); letter-spacing: .02em; }
  .ud { flex: var(--u, 1) 1 0; min-width: 0; display: flex; flex-direction: column; gap: 6%; }
  .ud .key { flex: 1; font-size: calc(var(--w) * .009); }
  .key { flex: var(--u, 1) 1 0; min-width: 0; display: grid; place-items: center; border-radius: calc(var(--w) * .006);
    background: #0b0c10; box-shadow: inset 0 calc(var(--w) * -.002) 0 rgb(0 0 0 / .7), inset 0 0 0 1px rgb(255 255 255 / .07);
    color: rgb(255 255 255 / .34); font: 500 calc(var(--w) * .0125)/1 "Geist", sans-serif; text-transform: uppercase;
    transition: background .9s ease, color .9s ease, box-shadow .9s ease; }
  body:not([data-s="closed"]) .key { color: color-mix(in srgb, var(--acc) 55%, #fff 20%); box-shadow: inset 0 calc(var(--w) * -.002) 0 rgb(0 0 0 / .7), inset 0 0 0 1px color-mix(in srgb, var(--acc) 30%, transparent); }
  .key.lit { background: var(--acc); color: #fff; box-shadow: 0 0 calc(var(--w) * .02) var(--acc); transition-duration: 0s; }
  #pad { position: absolute; left: 33%; width: 34%; top: 62%; height: 30%; border-radius: calc(var(--w) * .01);
    background: linear-gradient(180deg, #23252d, #1b1d23); box-shadow: inset 0 0 0 1px rgb(255 255 255 / .07); overflow: hidden; }
  #pad i { position: absolute; width: 10px; height: 10px; margin: -5px; border-radius: 50%; border: 1px solid var(--acc); opacity: 0; animation: ring .7s var(--ease); }
  @keyframes ring { from { opacity: .9; transform: scale(.4); } to { opacity: 0; transform: scale(calc(var(--w) / 90px)); } }


  /* ---------- the room: table, wall, window with the real sky, pendant lamp ----------
     Everything hangs in the base's plane (local z = up), so it turns with the laptop. */
  .tbl { position: absolute; left: calc(var(--w) * -.9); top: calc(var(--w) * -.72); width: calc(var(--w) * 2.8); height: calc(var(--w) * 1.72);
    transform: translateZ(calc(var(--t) * -1.15)); pointer-events: none; }
  /* everything that's lit by the room gets darker at night */
  .tbl-top, .tbl-lip, .rwall::before, .lit, .mat { filter: brightness(var(--lum, .5)); transition: filter 1s ease; }
  /* a solid oak desk */
  .tbl-top { position: absolute; inset: 0; border-radius: calc(var(--w) * .012);
    background:
      repeating-linear-gradient(90deg, transparent 0 calc(var(--w) * .93), rgb(0 0 0 / .28) calc(var(--w) * .93) calc(var(--w) * .934)),
      repeating-linear-gradient(91.2deg, rgb(255 255 255 / .035) 0 3px, transparent 3px 9px, rgb(0 0 0 / .05) 9px 10px, transparent 10px 23px),
      repeating-linear-gradient(88.6deg, rgb(70 40 15 / .12) 0 1px, transparent 1px 41px),
      radial-gradient(120% 60% at 30% 40%, rgb(255 220 170 / .12), transparent 70%),
      linear-gradient(180deg, #8d6545, #a47652 45%, #94694a); }
  .tbl-lip { position: absolute; left: 0; top: 100%; width: 100%; height: calc(var(--w) * .075); transform-origin: 50% 0; transform: rotateX(-90deg);
    background: linear-gradient(180deg, #b07f5a 0 6%, #7a5236 14%, #5e3e28); border-radius: 0 0 calc(var(--w) * .008) calc(var(--w) * .008); }
  /* daylight from the window lying across the desk */
  .sun { position: absolute; left: 57%; top: 1%; width: calc(var(--w) * .82); height: calc(var(--w) * 1.05); transform-origin: 50% 0; transform: translateZ(.4px) skewX(-24deg);
    background: linear-gradient(180deg, var(--ray, rgb(255 232 190 / .34)), transparent 92%); opacity: var(--rays, 0); transition: opacity 1.2s ease;
    -webkit-mask: linear-gradient(90deg, #000 47%, transparent 47% 53%, #000 53%), linear-gradient(#000 46%, transparent 46% 54%, #000 54%); -webkit-mask-composite: source-in;
    mask: linear-gradient(90deg, #000 47%, transparent 47% 53%, #000 53%) intersect, linear-gradient(#000 46%, transparent 46% 54%, #000 54%); }
  /* warm light from the desk lamp */
  .pool { position: absolute; left: calc(var(--w) * -.02); top: calc(var(--w) * .1); width: calc(var(--w) * 1.25); height: calc(var(--w) * 1.05); transform: translateZ(.7px);
    background: radial-gradient(closest-side, rgb(255 196 120 / .5), rgb(255 186 110 / .16) 55%, transparent); opacity: 0; transition: opacity .5s ease; }
  body.lamp-on .pool { opacity: 1; }
  .deck::before { content: ""; position: absolute; inset: 0; opacity: 0; transition: opacity .5s ease; pointer-events: none;
    background: radial-gradient(90% 130% at 0% 0%, rgb(255 186 106 / .22), transparent 70%); }
  body.lamp-on .deck::before { opacity: 1; }
  /* felt desk mat under the laptop */
  .mat { position: absolute; left: calc(var(--w) * .68); top: calc(var(--w) * .58); width: calc(var(--w) * 1.44); height: calc(var(--w) * .92); transform: translateZ(.2px);
    border-radius: calc(var(--w) * .03); background: radial-gradient(120% 90% at 50% 40%, #3a3d46, #2b2d34); box-shadow: inset 0 0 0 calc(var(--w) * .004) #24262c, 0 0 0 1px rgb(0 0 0 / .25); }
  .mat::after { content: ""; position: absolute; inset: calc(var(--w) * .014); border-radius: calc(var(--w) * .02); border: 1px dashed rgb(255 255 255 / .16); }

  /* the wall behind the desk */
  .rwall { position: absolute; left: 0; top: calc(var(--w) * -1.5); width: 100%; height: calc(var(--w) * 1.5); transform-origin: 50% 100%; transform: rotateX(-90deg);
    backface-visibility: hidden; -webkit-backface-visibility: hidden; transform-style: preserve-3d; }
  .rwall::before { content: ""; position: absolute; inset: 0; border-radius: calc(var(--w) * .012) calc(var(--w) * .012) 0 0;
    background: linear-gradient(0deg, rgb(0 0 0 / .4), transparent 6%), radial-gradient(70% 60% at 40% 45%, rgb(255 255 255 / .07), transparent),
      repeating-linear-gradient(0deg, rgb(0 0 0 / .02) 0 2px, transparent 2px 5px), linear-gradient(180deg, #7f786d, #8b8478 60%, #847d71); }
  .wglow { position: absolute; left: 0; top: 18%; width: 40%; height: 82%; opacity: 0; transition: opacity .5s ease;
    background: radial-gradient(closest-side at 50% 60%, rgb(255 190 110 / .34), transparent); }
  body.lamp-on .wglow { opacity: 1; }
  /* the window: painted wooden frame, a deep reveal, the real sky */
  .wtrim { position: absolute; left: 57.2%; bottom: calc(var(--w) * .335); width: calc(var(--w) * .9); height: calc(var(--w) * .86); border-radius: calc(var(--w) * .006);
    background: var(--frame, #8a8478); box-shadow: 0 calc(var(--w) * .014) calc(var(--w) * .03) rgb(0 0 0 / .35); transition: background 1s ease; }
  .win { position: absolute; left: 58.2%; bottom: calc(var(--w) * .365); width: calc(var(--w) * .82); height: calc(var(--w) * .8); overflow: hidden; transform: translateZ(.3px);
    border: calc(var(--w) * .014) solid var(--frame, #8a8478); border-radius: calc(var(--w) * .004);
    box-shadow: inset 0 0 calc(var(--w) * .03) rgb(0 0 0 / .45), 0 0 calc(var(--w) * .25) var(--halo, transparent); transition: border-color 1s ease; }
  .win::before, .win::after { content: ""; position: absolute; z-index: 2; background: var(--frame, #8a8478); transition: background 1s ease; box-shadow: 0 0 calc(var(--w) * .006) rgb(0 0 0 / .4); }
  .win::before { left: 50%; top: 0; bottom: 0; width: calc(var(--w) * .014); margin-left: calc(var(--w) * -.007); }
  .win::after { top: 42%; left: 0; right: 0; height: calc(var(--w) * .014); }
  .glass { position: absolute; inset: 0; z-index: 1; background: linear-gradient(115deg, rgb(255 255 255 / .1), transparent 30%, transparent 62%, rgb(255 255 255 / .06) 70%, transparent 78%); }
  .sky { position: absolute; inset: 0; background: linear-gradient(180deg, var(--sky1, #04060f), var(--sky2, #0a1024) 58%, var(--sky3, #111a36)); }
  .stars { position: absolute; inset: 0; opacity: var(--stars, 1); transition: opacity 1.2s ease;
    background: radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 31% 9%, #fff, transparent), radial-gradient(1.4px 1.4px at 44% 31%, #dfe8ff, transparent),
      radial-gradient(1px 1px at 63% 14%, #fff, transparent), radial-gradient(1.2px 1.2px at 78% 36%, #fff, transparent), radial-gradient(1px 1px at 88% 11%, #dfe8ff, transparent),
      radial-gradient(1px 1px at 22% 44%, #fff, transparent), radial-gradient(1.3px 1.3px at 55% 49%, #fff, transparent), radial-gradient(1px 1px at 70% 58%, #fff, transparent), radial-gradient(1px 1px at 8% 60%, #fff, transparent); }
  .orb { position: absolute; left: var(--ox, 70%); top: var(--oy, 24%); width: calc(var(--w) * .075); aspect-ratio: 1; margin: calc(var(--w) * -.0375); border-radius: 50%;
    background: #fff3c4; box-shadow: 0 0 calc(var(--w) * .07) calc(var(--w) * .02) rgb(255 226 150 / .75); }
  .orb.moon { background: radial-gradient(circle at 68% 38%, transparent 52%, #f3f0e4 54%); box-shadow: none; filter: drop-shadow(0 0 calc(var(--w) * .02) rgb(220 228 255 / .7)); }
  .hills { position: absolute; left: 0; right: 0; bottom: 0; height: 36%;
    background: radial-gradient(75% 100% at 22% 100%, var(--hill, #070b18) 70%, transparent 71%), radial-gradient(85% 78% at 84% 100%, var(--hill2, #0a1022) 70%, transparent 71%); }
  /* linen curtains on a rod */
  .curt { position: absolute; bottom: calc(var(--w) * .2); width: calc(var(--w) * .2); height: calc(var(--w) * 1.08); transform: translateZ(1.2px);
    background: linear-gradient(0deg, rgb(0 0 0 / .18), transparent 30%),
      repeating-linear-gradient(90deg, rgb(0 0 0 / .26) 0, rgb(255 255 255 / .08) 16%, rgb(0 0 0 / .12) 26%, rgb(255 255 255 / .1) 38%, rgb(0 0 0 / .24) 50%), #c9bfa9;
    border-radius: 0 0 calc(var(--w) * .01) calc(var(--w) * .01); box-shadow: 0 calc(var(--w) * .02) calc(var(--w) * .04) rgb(0 0 0 / .35); }
  .curt.l { left: 52.6%; } .curt.r { left: 88.6%; }
  .crod { position: absolute; left: 51.8%; bottom: calc(var(--w) * 1.27); width: calc(var(--w) * 1.33); height: calc(var(--w) * .014); border-radius: 99px; transform: translateZ(1.5px);
    background: linear-gradient(180deg, #4a4540, #1f1c19); box-shadow: 0 calc(var(--w) * .01) calc(var(--w) * .015) rgb(0 0 0 / .35); }
  .crod::before, .crod::after { content: ""; position: absolute; top: 50%; width: calc(var(--w) * .03); aspect-ratio: 1; margin-top: calc(var(--w) * -.015); border-radius: 50%; background: #2a2622; }
  .crod::before { left: calc(var(--w) * -.02); } .crod::after { right: calc(var(--w) * -.02); }
  /* a framed print, and the cat pinned up next to it */
  .poster { position: absolute; left: 2.2%; bottom: calc(var(--w) * .44); width: calc(var(--w) * .44); padding: calc(var(--w) * .034); transform: translateZ(1px);
    background: #f0ece3; border: calc(var(--w) * .013) solid #17171a; border-radius: calc(var(--w) * .003);
    box-shadow: calc(var(--w) * .01) calc(var(--w) * .022) calc(var(--w) * .04) rgb(0 0 0 / .45), inset 0 0 calc(var(--w) * .008) rgb(0 0 0 / .2); }
  .poster img { display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover; }
  .poster p { margin: calc(var(--w) * .016) 0 0; display: flex; justify-content: space-between; color: #26262a; font: 600 calc(var(--w) * .0125)/1 "Geist", sans-serif; letter-spacing: .22em; text-transform: uppercase; }
  .poster p span { font-weight: 400; letter-spacing: .1em; opacity: .6; }
  .snap { position: absolute; left: 20.5%; bottom: calc(var(--w) * .74); width: calc(var(--w) * .15); padding: calc(var(--w) * .01) calc(var(--w) * .01) calc(var(--w) * .03); transform: translateZ(1px) rotate(5deg);
    background: #f4f1ea; box-shadow: 0 calc(var(--w) * .01) calc(var(--w) * .022) rgb(0 0 0 / .4); }
  .snap img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; }
  .snap::before { content: ""; position: absolute; left: 30%; top: calc(var(--w) * -.014); width: 40%; height: calc(var(--w) * .03); rotate: -4deg; background: rgb(240 200 120 / .72); }

  /* ---------- little 3D things on the desk (built by script: boxes and cylinders) ---------- */
  .props { position: absolute; inset: 0; pointer-events: none; }
  .o { position: absolute; width: 0; height: 0; }
  .f { position: absolute; left: 0; top: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; filter: brightness(calc(var(--lum, .5) * var(--sh, 1))); transition: filter 1s ease; }
  .f.two { backface-visibility: visible; -webkit-backface-visibility: visible; }
  .f.cap { border-radius: 50%; }
  .mug { background: linear-gradient(180deg, #ece6da, #d9d1c2); }
  .mug.cap { background: radial-gradient(circle, #4a2a18 0 52%, #2c180d 64%, #ddd5c6 67%); }
  .mug-h { border: calc(var(--w) * .011) solid #e2dbcd; border-radius: 45%; }
  .steam { width: calc(var(--w) * .05); height: calc(var(--w) * .1); margin-left: calc(var(--w) * -.025); margin-top: calc(var(--w) * -.1); transform-origin: 50% 100%;
    background: radial-gradient(40% 50% at 50% 60%, rgb(255 255 255 / .22), transparent); filter: blur(calc(var(--w) * .006)); opacity: 0; animation: steam 3.6s ease-in infinite; }
  .steam + .steam { animation-delay: 1.8s; }
  @keyframes steam { 0% { opacity: 0; translate: 0 0 0; } 30% { opacity: 1; } 100% { opacity: 0; translate: 0 0 calc(var(--w) * .09); } }
  .pot { background: linear-gradient(180deg, #c06c45, #a3583a); }

    background: linear-gradient(90deg, #c8bf5a 0 5%, #2e6a3a 11%, #4a9152 48%, #3d7e45 52%, #285a31 90%, #c8bf5a 95%); }
  .book.top, .book.bk { background: var(--c); }
  .book.top { background: linear-gradient(90deg, transparent 8%, rgb(255 255 255 / .12) 8% 9%, transparent 9%), var(--c); }
  .book.fr, .book.sd { background: repeating-linear-gradient(0deg, #efe7d4 0 1px, #d8cdb4 1px 2px); }
  .note.top { background: linear-gradient(90deg, transparent 84%, #0b0b0d 84% 87%, transparent 87%), linear-gradient(135deg, #2a2b30, #1b1c20); border-radius: 0 calc(var(--w) * .006) calc(var(--w) * .006) 0; }
  .note.fr, .note.sd, .note.bk { background: #e7dfcc; }
  .pen { background: linear-gradient(90deg, #b8903f, #e6c27a 40%, #8f6c2c); }
  .pen.cap { background: #1a1a1c; }
  .phone.top { background: radial-gradient(circle at 18% 12%, #0c0c0e 0 5%, #3a3b40 6% 7.5%, transparent 8%), linear-gradient(135deg, #2b2c31, #18191c); border-radius: calc(var(--w) * .012); }
  .phone.fr, .phone.sd, .phone.bk { background: #6d6f75; }
  .metal { background: linear-gradient(90deg, #121317, #3a3d46 45%, #16171b); }
  .metal.cap { background: radial-gradient(circle at 40% 35%, #3b3e47, #15161a 70%); }
  .shade { background: linear-gradient(180deg, #2b2e36, #14151a); }
  .shade.cap { background: radial-gradient(circle at 40% 35%, #3b3e47, #15161a 70%); }
  .bulb { border-radius: 50%; background: #2a2a2e; transition: background .4s ease, box-shadow .4s ease; }
  body.lamp-on .bulb { background: radial-gradient(closest-side, #fffaf0, #ffd796 60%, #e0a14e); box-shadow: 0 0 calc(var(--w) * .06) calc(var(--w) * .02) rgb(255 205 130 / .85); filter: none; }
  .sill { background: var(--frame, #8a8478); }
  #lamp-hit .f { pointer-events: auto; cursor: pointer; }

  /* ---------- lid ---------- */
  .lid { position: absolute; left: calc(var(--w) * -.5); top: calc(var(--h) * -1); width: var(--w); height: var(--h);
    transform-origin: 50% 100%; transform: rotateX(var(--lid, -87deg)); transition: transform 1.3s cubic-bezier(.34, 1.3, .44, 1); }

// whatever you type shows up on the laptop's screen
let typed = "", typedTimer = 0;
function type(ch) {
  if (body.dataset.s !== "on") return;
  typed = ch === "\b" ? typed.slice(0, -1) : (typed + ch).slice(-28);
  $("typed").textContent = typed ? "> " + typed : "";
  $("typed").style.opacity = 1;
  clearTimeout(typedTimer);
  typedTimer = setTimeout(() => { $("typed").style.opacity = 0; setTimeout(() => { typed = ""; $("typed").textContent = ""; }, 600); }, 4000);
  const t = typed.toLowerCase();
  if (t.endsWith("meow") || t.endsWith("miau")) peek("meow.");
  else if (t.endsWith("hello") || t.endsWith("hallo") || t.endsWith("hi ")) peek("oh. hi.");
}

  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (zoom) { if (e.key === "Escape") zoomOut(); return; }
  if (body.dataset.s === "closed") return;
  light(e.code);
  if (e.key === "Backspace") type("\b");
  else if (e.key === "Escape") close();
  else if (e.key.length === 1) { if (e.code === "Space") e.preventDefault(); type(e.key); }
});

let timers = [];
function open() {
  if (body.dataset.s !== "closed") return;
  body.dataset.s = "boot";

const phone = () => matchMedia("(max-width: 700px) and (orientation: portrait)").matches;
const home = () => (phone() ? { x: -22, y: -9 } : { x: -24, y: -16 });
let cur = { ...home() }, goal = { ...home() }, raf = 0, drag = null, idle = 0;
function place() {
  const lift = phone() ? "translateY(calc(var(--w) * .86 + 8vh))" : "translateY(calc(var(--w) * .27))";
  rig.style.transform = `${lift} rotateX(${cur.x.toFixed(2)}deg) rotateY(${cur.y.toFixed(2)}deg)`;
}
function frame() {
  cur.x += (goal.x - cur.x) * .12; cur.y += (goal.y - cur.y) * .12;
  place();
  raf = Math.abs(goal.x - cur.x) + Math.abs(goal.y - cur.y) > .02 ? requestAnimationFrame(frame) : 0;
}
const kick = () => { if (!raf) raf = requestAnimationFrame(frame); };
function goHome() { const h = home(); goal.x = h.x; goal.y = h.y + Math.round((goal.y - h.y) / 360) * 360; kick(); }

stage.addEventListener("pointerdown", (e) => {
  if (zoom) return;
  drag = { id: e.pointerId, x: e.clientX, y: e.clientY, gx: goal.x, gy: goal.y, moved: false, target: e.target };
  clearTimeout(idle);
});

  if (drag && e.pointerId === drag.id) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 7) return;
    if (!drag.moved) { drag.moved = true; stage.classList.add("drag"); try { stage.setPointerCapture(e.pointerId); } catch {} }
    goal.y = drag.gy + dx * .45; goal.x = clamp(drag.gx - dy * .35, -78, 4);
    kick();

    const h = home(), base = Math.round((goal.y - h.y) / 360) * 360;
    if (Math.abs(goal.y - base - h.y) > 30 || Math.abs(goal.x - h.x) > 14) return;   // you turned it: leave it alone
    goal.y = base + h.y + (e.clientX / innerWidth - .5) * 9; goal.x = h.x - (e.clientY / innerHeight - .5) * 6;

/* ============ zoom into the screen ============ */
// 0 = looking at the laptop, 1 = flying in, 2 = inside, 3 = flying out
// Two moves: the laptop turns to face you, then the camera flies straight into the screen.
// The desktop (#os) rides along on top of the screen the whole way, clipped to its shape,
// so what you see stays sharp instead of blowing up the 3D scene.
let zoom = 0;
const os = $("os");
const EASE = "cubic-bezier(.76, 0, .24, 1)";
const T_TURN = reduced ? 1 : 560, T_FLY = reduced ? 1 : 900, T_OPEN = reduced ? 1 : 420;
const ID = "translate(0px, 0px) scale(1)";
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const done = (a) => a.finished.catch(() => {});

// where the screen sits right now, and the two transforms that carry it onto the window
function fit() {
  const el = document.querySelector(".screen"), r = el.getBoundingClientRect();
  const W = innerWidth, H = innerHeight;
  const k = Math.min(W / r.width, H / r.height);                 // screen grows until it touches the window edges
  const ix = (W - r.width * k) / 2, iy = (H - r.height * k) / 2;  // what's left over around it at the end
  const rad = (parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0) * (r.width / el.offsetWidth) * k;
  return {
    stage: `translate(${(ix - k * r.left).toFixed(2)}px, ${(iy - k * r.top).toFixed(2)}px) scale(${k.toFixed(5)})`,
    os: `translate(${(r.left - ix / k).toFixed(2)}px, ${(r.top - iy / k).toFixed(2)}px) scale(${(1 / k).toFixed(5)})`,
    clip: `inset(${iy.toFixed(1)}px ${ix.toFixed(1)}px round ${rad.toFixed(1)}px)`,
  };
}
function turnTo(c, ms) {
  rig.style.transition = `transform ${ms}ms cubic-bezier(.45, 0, .2, 1)`;
  cur = c; goal = { ...c }; place();
}
const facing = () => ({ x: -13, y: Math.round(cur.y / 360) * 360 });

async function zoomIn() {
  if (zoom || body.dataset.s !== "on") return;
  zoom = 1; cancelAnimationFrame(raf); raf = 0; clearTimeout(idle); body.classList.add("zooming");
  turnTo(facing(), T_TURN);
  await wait(T_TURN + 30);
  rig.style.transition = "none";
  const f = fit();
  os.getAnimations().forEach((a) => a.cancel());
  body.classList.add("os-fly");
  stage.animate([{ transform: ID }, { transform: f.stage }], { duration: T_FLY, easing: EASE, fill: "forwards" });
  const fly = os.animate([
    { transform: f.os, clipPath: f.clip, opacity: 0 },
    { opacity: 1, offset: .3 },
    { transform: ID, clipPath: f.clip, opacity: 1 },
  ], { duration: T_FLY, easing: EASE, fill: "forwards" });
  await done(fly);
  if (zoom !== 1) return;
  // landed: the picture spreads out to the window edges, the desktop wakes up
  body.dataset.z = "1"; os.setAttribute("aria-hidden", "false");
  const grow = os.animate([{ clipPath: f.clip }, { clipPath: "inset(0px 0px round 0px)" }], { duration: T_OPEN, easing: "cubic-bezier(.2, .8, .2, 1)", fill: "forwards" });
  await done(grow);
  os.getAnimations().forEach((a) => a.cancel());   // leave #os plain, so scrolling on phones behaves
  body.classList.remove("os-fly");
  zoom = 2;
  $("os-x").focus({ preventScroll: true });
}

async function zoomOut() {
  if (zoom !== 2) return;
  zoom = 3; os.setAttribute("aria-hidden", "true"); os.scrollTop = 0;
  stage.getAnimations().forEach((a) => a.cancel());   // measure the screen where it really is
  const f = fit();
  stage.animate([{ transform: f.stage }, { transform: f.stage }], { duration: 1, fill: "forwards" });
  body.classList.add("os-fly");
  delete body.dataset.z;
  const shrink = os.animate([{ clipPath: "inset(0px 0px round 0px)" }, { clipPath: f.clip }], { duration: T_OPEN * .8, easing: "cubic-bezier(.5, 0, .75, 0)", fill: "forwards" });
  await done(shrink);
  stage.getAnimations().forEach((a) => a.cancel());
  const back = stage.animate([{ transform: f.stage }, { transform: ID }], { duration: T_FLY, easing: EASE, fill: "forwards" });
  os.animate([
    { transform: ID, clipPath: f.clip, opacity: 1 },
    { opacity: 1, offset: .7 },
    { transform: f.os, clipPath: f.clip, opacity: 0 },
  ], { duration: T_FLY, easing: EASE, fill: "forwards" });
  await done(back);
  os.getAnimations().forEach((a) => a.cancel()); stage.getAnimations().forEach((a) => a.cancel());
  body.classList.remove("os-fly", "zooming");
  turnTo({ ...home(), y: home().y + Math.round(cur.y / 360) * 360 }, reduced ? 1 : 750);
  await wait(reduced ? 10 : 760);
  rig.style.transition = ""; zoom = 0;
}
$("os-x").addEventListener("click", zoomOut);

/* ============ the desk: little 3D objects made of boxes and cylinders ============ */
// Units are laptop widths. Desk coordinates: x to the right, y towards you, z up.
{
  const U = (k) => `calc(var(--w) * ${+k.toFixed(4)})`;
  const T = (x, y, z) => `translate3d(${U(x)}, ${U(y)}, ${U(z)})`;
  const face = (cls, w, h, tf, sh = 1, extra = "") =>
    `<i class="f ${cls}" style="width:${U(w)};height:${U(h)};margin:${U(-h / 2)} 0 0 ${U(-w / 2)};transform:${tf};--sh:${sh.toFixed(2)};${extra}"></i>`;
  const group = (tf, html, attrs = "") => `<div class="o"${attrs} style="transform:${tf}">${html}</div>`;
  const at = (x, y, z, rot, html, attrs = "", css = "") => `<div class="o"${attrs} style="left:${U(x)};top:${U(y)};transform:translateZ(${U(z)}) rotateZ(${rot}deg);${css}">${html}</div>`;
  // a box standing on its own floor, centred on 0,0
  const box = (c, w, d, h) =>
    face(c + " top", w, d, T(0, 0, h), 1) +
    face(c + " fr", w, h, T(0, d / 2, h / 2) + " rotateX(-90deg)", .8) +
    face(c + " bk", w, h, T(0, -d / 2, h / 2) + " rotateX(-90deg) rotateY(180deg)", .5) +
    face(c + " sd", d, h, T(-w / 2, 0, h / 2) + " rotateZ(90deg) rotateX(-90deg)", .7) +
    face(c + " sd", d, h, T(w / 2, 0, h / 2) + " rotateZ(-90deg) rotateX(-90deg)", .6);
  // a cylinder along z; light comes from the front left
  const cyl = (c, r, h, n = 14, cap = "top") => {
    const fw = 2 * r * Math.tan(Math.PI / n) * 1.06;
    let html = "";
    for (let i = 0; i < n; i++) {
      const a = i * 360 / n, dot = (.5 * Math.sin(a * RAD0) + .8 * Math.cos(a * RAD0)) / .943;
      html += face(c, fw, h, `rotateZ(${a}deg) ${T(0, r, h / 2)} rotateX(-90deg)`, .48 + .5 * Math.max(0, dot));
    }
    if (cap) html += face(c + " cap", 2 * r, 2 * r, `translateZ(${U(cap === "top" ? h : 0)})${cap === "top" ? "" : " rotateX(180deg)"}`, 1);
    return html;
  };
  const RAD0 = Math.PI / 180;
  const rod = (c, L, t) => face(c + " two", t, L, T(0, 0, L / 2) + " rotateX(-90deg)", .8) + face(c + " two", t, L, T(0, 0, L / 2) + " rotateZ(90deg) rotateX(-90deg)", .6);

  // desk lamp: heavy round foot, two arms, a dome shade pointing down at the desk
  const lamp = at(.17, .3, 0, 35,
    cyl("metal", .075, .02, 18) +
    group(`translateZ(${U(.02)}) rotateY(10deg)`,
      rod("metal", .43, .02) +
      group(`translateZ(${U(.43)})`, cyl("metal", .02, .03, 10)) +
      group(`translateZ(${U(.43)}) rotateY(75deg)`,
        rod("metal", .37, .018) +
        group(`translateZ(${U(.37)}) rotateY(85deg)`,
          cyl("shade", .06, .1, 16, "bottom") +
          face("bulb two", .07, .07, `translateZ(${U(.075)})`, 1)))),
    ' id="lamp-hit"');

  const leaves = [[0, 12, .3], [55, 24, .25], [110, 16, .28], [170, 26, .22], [215, 14, .3], [270, 22, .24], [320, 18, .27], [85, 6, .33]]
    .map(([a, tilt, L]) => `<i class="f two leaf" style="width:${U(.055)};height:${U(L)};margin:${U(-L)} 0 0 ${U(-.0275)};transform:translateZ(${U(.11)}) rotateZ(${a}deg) rotateX(${-(90 - tilt)}deg);--sh:${(.75 + (a % 90) / 300).toFixed(2)}"></i>`).join("");

  $("props").innerHTML = [
    lamp,
    // plant in a terracotta pot, back right under the window
    at(2.55, .3, 0, 0, cyl("pot", .07, .11, 16) + group(`translateZ(${U(.095)})`, cyl("rim", .077, .022, 16, null)) + leaves),
    // two books, a bit crooked
    at(2.14, .38, 0, 7, box("book", .32, .22, .034), "", "--c:#7b2f35"),
    at(2.12, .37, .034, -5, box("book", .28, .2, .03), "", "--c:#2f4f6b"),
    // a mug of coffee, still steaming
    at(2.34, .82, 0, -35, cyl("mug", .045, .1, 16) +
      `<i class="f two mug-h" style="width:${U(.05)};height:${U(.062)};margin:${U(-.031)} 0 0 ${U(-.025)};transform:${T(.056, 0, .05)} rotateX(-90deg)"></i>` +
      (reduced ? "" : group(`translateZ(${U(.1)})`, `<i class="f two steam" style="transform:rotateX(-90deg)"></i><i class="f two steam" style="transform:rotateZ(90deg) rotateX(-90deg)"></i>`))),
    // notebook with a pen on it
    at(2.42, 1.3, 0, -12, box("note", .24, .32, .016) + group(`translateZ(${U(.023)}) rotateZ(64deg) rotateY(90deg) translateZ(${U(-.1)})`, cyl("pen", .007, .2, 8))),

/* ============ the room: real sky in the window, and the lamp ============ */
const RAD = Math.PI / 180, LAT = 51, LON = 10.5;
const fakeHour = parseFloat(new URLSearchParams(location.search).get("h"));   // ?h=14.5 shows the room at 14:30 (UTC+1)
function sunNow() {
  const d = new Date();
  if (!isNaN(fakeHour)) d.setUTCHours(0, Math.round((fakeHour - 1) * 60), 0, 0);
  const n = (d - Date.UTC(d.getUTCFullYear(), 0, 0)) / 864e5;
  const decl = -23.44 * Math.cos(2 * Math.PI * (n + 10) / 365) * RAD, lat = LAT * RAD;
  const solar = d.getUTCHours() + d.getUTCMinutes() / 60 + LON / 15, ha = (solar - 12) * 15 * RAD;
  return { alt: Math.asin(Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha)) / RAD, solar };
}
const lerp = (a, b, t) => a + (b - a) * t;
const mixHex = (a, b, t) => "#" + [1, 3, 5].map((i) => Math.round(lerp(parseInt(a.slice(i, i + 2), 16), parseInt(b.slice(i, i + 2), 16), t)).toString(16).padStart(2, "0")).join("");
// sky colors at four sun heights: night, dusk, golden hour, day
const SKY = [[-14, "#04060f", "#0a1024", "#111a36"], [-3, "#1b2450", "#6a4a7c", "#f0976a"], [5, "#3d6bb8", "#9db7dc", "#ffd9a6"], [18, "#3f7fd6", "#7fb0ea", "#cfe4f7"]];
let dayness = 0;
function paintRoom() {
  const { alt, solar } = sunNow();
  let i = 0;
  while (i < SKY.length - 2 && alt > SKY[i + 1][0]) i++;
  const A = SKY[i], B = SKY[i + 1], t = clamp((alt - A[0]) / (B[0] - A[0]), 0, 1);
  [1, 2, 3].forEach((n) => rs.setProperty("--sky" + n, mixHex(A[n], B[n], t)));
  dayness = clamp((alt + 5) / 13, 0, 1);
  const night = alt < -5;
  rs.setProperty("--stars", clamp((-alt - 4) / 8, 0, 1).toFixed(2));
  rs.setProperty("--hill", mixHex("#070b18", "#31503c", dayness)); rs.setProperty("--hill2", mixHex("#0a1022", "#3f6349", dayness));
  rs.setProperty("--frame", mixHex("#5e5a52", "#e6e0d2", dayness));
  rs.setProperty("--halo", `rgb(190 215 255 / ${(dayness * .22).toFixed(2)})`);
  $("orb").classList.toggle("moon", night);
  rs.setProperty("--ox", night ? "72%" : clamp(50 + (solar - 12) * 7.500, 8, 92).toFixed(1) + "%");
  rs.setProperty("--oy", night ? "24%" : clamp(74 - alt * 2.2, 10, 96).toFixed(1) + "%");
  rs.setProperty("--ray", night ? "rgb(170 195 255 / .16)" : `rgb(255 ${Math.round(lerp(196, 236, dayness))} ${Math.round(lerp(140, 200, dayness))} / .34)`);
  rs.setProperty("--rays", (night ? .55 : alt > 1 ? dayness : 0).toFixed(2));
  relight();
}
function relight() {   // how bright the room is: daylight plus the lamp
  const on = body.classList.contains("lamp-on");
  rs.setProperty("--lum", clamp(.3 + dayness * .58 + (on ? .3 * (1 - dayness * .7) : 0), 0, .96).toFixed(2));
  rs.setProperty("--air", mixHex("#050609", "#12151d", clamp(dayness * .8 + (on ? .2 : 0), 0, 1)));
}
function setLamp(on, save) {
  body.classList.toggle("lamp-on", on);
  if (save) { try { localStorage.setItem("lamp", on ? "1" : "0"); } catch {} }
  relight();
}
paintRoom(); setInterval(paintRoom, 60000);
{ let saved = null; try { saved = localStorage.getItem("lamp"); } catch {} setLamp(saved ? saved === "1" : dayness < .5, false); }

/* ============ discord status (through Lanyard) ============ */
// Your Discord user id. Empty = the Discord widget and window stay hidden.
// The account has to be in the Lanyard Discord server (discord.gg/lanyard) for this to work.
const DISCORD_ID = "__DISCORD_ID__";
const DC_STATUS = { online: ["online", "#3ba55d"], idle: ["idle", "#f0b232"], dnd: ["busy", "#f23f43"], offline: ["offline", "#80848e"] };
function renderDiscord(d) {
  const u = d.discord_user || {}, [word, color] = DC_STATUS[d.discord_status] || DC_STATUS.offline;
  const name = u.global_name || u.display_name || u.username || "discord";
  const acts = d.activities || [], custom = acts.find((a) => a.type === 4), game = acts.find((a) => a.type === 0);
  let kind = "", what = "";
  if (d.listening_to_spotify && d.spotify) { kind = "listening to"; what = `${d.spotify.song} · ${d.spotify.artist}`; }
  else if (game) { kind = "playing"; what = game.name; }
  else if (custom && custom.state) { kind = "status"; what = custom.state; }
  document.querySelectorAll("[data-dc]").forEach((el) => { el.hidden = false; });
  each("dc-dot", (el) => { el.style.background = color; el.style.boxShadow = `0 0 .9em ${color}`; });
  setText("dc-v", word); setText("dc-s", what ? `${kind} ${what}` : name);
  const avatar = u.avatar ? `https://cdn.discordapp.com/avatars/${encodeURIComponent(u.id)}/${encodeURIComponent(u.avatar)}.png?size=128` : "https://cdn.discordapp.com/embed/avatars/0.png";
  const html = `<div class="dcc"><span class="av"><img src="${esc(avatar)}" alt="" referrerpolicy="no-referrer"><i style="--c:${color}"></i></span><div><b>${esc(name)}</b><span>${esc(word)}</span></div></div>
    ${what ? `<div class="dc-act"><small>${esc(kind)}</small>${esc(what)}</div>` : ""}`;
  const card = $("dc-card");
  if (card._html !== html) { card.innerHTML = html; card._html = html; }
  ow("dc").hidden = false;
}
async function pollDiscord() {
  if (!document.hidden) {
    try { const r = await fetch(`https://api.lanyard.rest/v1/users/${DISCORD_ID}`, { cache: "no-store" }); const j = r.ok ? await r.json() : null; if (j && j.success) renderDiscord(j.data); } catch {}
  }
  setTimeout(pollDiscord, 12000);
}
if (/^\d{15,22}$/.test(DISCORD_ID)) pollDiscord();

/* ============ the look chosen in the admin panel is this laptop's wallpaper ============ */
const LOOKS = {
  aurora: ["#7c8cff", "#36e0c2", "#070a12", "aurora"], night: ["#6ea4ff", "#3d6fd6", "#06080f", "sky"],
  northern: ["#4ade80", "#22d3ee", "#04100d", "p-northern"], tokyo: ["#f472b6", "#22d3ee", "#0b0618", "p-tokyo"],
  lake: ["#7dd3fc", "#818cf8", "#060c12", "p-lake"], cabin: ["#ff9f5a", "#ffd27a", "#0d0806", "p-cabin"],
};
function applyLook(d) {
  const t = LOOKS[d && d.theme] || LOOKS.aurora;
  const acc = d && /^#[0-9a-f]{6}$/i.test(d.accent || "") ? d.accent : t[0], bg = (d && d.bg) || t[3];
  rs.setProperty("--acc", acc); rs.setProperty("--acc2", t[1]);
  let wall;
  if (/^p-[a-z]+$/.test(bg)) wall = `url("img/bg/${bg.slice(2)}.jpg")`;
  else if (bg === "sky") wall = `url("img/backdrop.jpg")`;
  else if (bg === "solid") wall = `linear-gradient(160deg, color-mix(in srgb, ${acc} 16%, ${t[2]}), ${t[2]})`;
  else wall = `radial-gradient(90% 90% at 12% 0%, color-mix(in srgb, ${acc} 55%, transparent), transparent 70%), radial-gradient(70% 80% at 100% 15%, color-mix(in srgb, ${t[1]} 45%, transparent), transparent 70%), ${t[2]}`;
  rs.setProperty("--wall", wall);
}
fetch("/api/look").then((r) => (r.ok ? r.json() : null)).then((j) => j && applyLook(j.design)).catch(() => {});

/* ============ clock ============ */
const clockFmt = new Intl.DateTimeFormat("en-GB", { timeZone: "Europe/Berlin", weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
const tickClock = () => { const t = clockFmt.format(new Date()).replace(",", ""); if ($("clock").textContent !== t) { $("clock").textContent = t; $("os-clock").textContent = t; } };
tickClock(); setInterval(tickClock, 5000);

/* ============ live data ============ */
// A random id per tab, so the server can count who is here right now.
let visitId = "";
try { visitId = sessionStorage.getItem("vid") || ""; } catch {}
if (!/^[a-f0-9]{16}$/.test(visitId)) {
  visitId = [...crypto.getRandomValues(new Uint8Array(8))].map((b) => b.toString(16).padStart(2, "0")).join("");
  try { sessionStorage.setItem("vid", visitId); } catch {}
}
const two = (n) => String(n).padStart(2, "0");
function upText() {
  if (live.up == null) return "–";
  const t = Math.floor(live.up + (Date.now() - live.upAt) / 1000);
  const d = Math.floor(t / 86400), h = Math.floor(t % 86400 / 3600), m = Math.floor(t % 3600 / 60);
  return `${d ? d + "d " : ""}${two(h)}:${two(m)}:${two(t % 60)}`;
}
function flies(n) {
  n = clamp(n, 1, 9);
  const box = $("flies");
  while (box.children.length > n) box.lastChild.remove();
  while (box.children.length < n) {
    const i = box.children.length, f = document.createElement("div");
    f.className = "fly";
    f.style.cssText = `--dur:${11 + (i * 37 % 9)}s; --del:${-(i * 2.7).toFixed(1)}s; --r:calc(var(--w) * ${(.56 + (i * 13 % 5) * .035).toFixed(3)}); --y:calc(var(--w) * ${(-.16 + (i * 7 % 6) * .06).toFixed(3)})`;
    f.innerHTML = "<i><b></b></i>";
    box.append(f);
  }
}
function render(d) {
  const mc = d.mc || {};
  each("mc-dot", (el) => { el.className = "dot" + (mc.active ? " on" : ""); });
  if (mc.active) {
    setText("mc-v", mc.online ? `${mc.online} playing` : "online");
    setText("mc-s", mc.online ? `of ${mc.max} · friends only` : "nobody on · friends only");
  } else { setText("mc-v", "sleeping"); setText("mc-s", "the world is saved"); }
  if (d.stats) {
    live.up = d.stats.uptime; live.upAt = Date.now(); live.cpu = d.stats.cpu || 0;
    setText("up-s", `awake · cpu ${Math.round(live.cpu)}%`); setText("up-v", upText());
    for (const [k, v] of [["cpu", live.cpu], ["mem", d.stats.mem_pct || 0]]) {
      setText(k + "-n", Math.round(v) + "%");
      document.querySelectorAll(`[data-bar="${k}"]`).forEach((b) => { b.style.width = clamp(v, 1.5, 100) + "%"; });
    }
  }
  const v = d.visitors;
  if (v) {
    setText("here-v", v.here > 1 ? `${v.here} people here` : "only you here");
    setText("here-s", `${v.today} today · ${v.total} all time`);
    setText("here-n", String(v.here)); setText("today-n", String(v.today)); setText("total-n", String(v.total));
    if (live.here && v.here > live.here) peek("someone just walked in.");
    live.here = v.here; flies(v.here);
  }
}
let pollTimer = 0;
async function poll() {
  clearTimeout(pollTimer);
  if (!document.hidden) {
    try { const r = await fetch(`/api/public?id=${visitId}`, { cache: "no-store" }); if (r.ok) render(await r.json()); } catch {}
  }
  pollTimer = setTimeout(poll, 5000);
}
document.addEventListener("visibilitychange", () => { if (!document.hidden) poll(); });
setInterval(() => setText("up-v", upText()), 1000);
flies(1); poll();
