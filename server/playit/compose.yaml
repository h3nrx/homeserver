services:
  playit:
    image: ghcr.io/playit-cloud/playit-agent:1.0
    container_name: playit
    restart: unless-stopped
    # Host network, so the agent reaches 127.0.0.1:25565.
    network_mode: host
    env_file:
      - .env
    # Locked down: no extra privileges, read-only access to its own file system.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /run
    mem_limit: 256m
    pids_limit: 128
